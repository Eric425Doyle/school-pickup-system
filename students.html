<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Students & QR Cards</title><link rel="stylesheet" href="style.css?v=4.3.4"></head><body>
<nav><a href="index.html">Home</a><a href="scanner.html">Scanner</a><a href="display.html">Display</a><a href="admin.html">Admin</a><a class="active" href="students.html">Students & QR</a><a href="history.html">History</a></nav>
<div class="container"><div class="card"><h1>Students & QR Cards — V4.3.4</h1><p>Create and maintain the shared student/card registry. The QR code stores only the QR ID; the student name and pickup number stay in Firestore.</p>
<input id="studentName" type="text" placeholder="Student name"><br><input id="pickupNumber" type="text" inputmode="numeric" placeholder="Pickup number"><br><input id="qrId" type="text" placeholder="QR ID (example: SPU-ABC123)"><br><label><input id="studentActive" type="checkbox" checked> Active</label><br><br><button class="primary" id="saveStudent">Save Student</button><button class="queue-move" id="cancelEdit" style="margin-left:8px;display:none">Cancel Edit</button><div id="studentMessage" class="message"></div></div>
<div class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><h2>Student Registry</h2><button class="secondary" id="ensureDemo">Create/Restore Test Student #42</button></div><div id="studentList" class="queue-list"></div></div></div>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script><script src="firebase-config.js?v=4.3.4"></script><script src="auth.js?v=4.3.4"></script><script src="roles.js?v=4.3.4"></script><script src="app.js?v=4.3.4"></script><script>requireRole(["admin"]);</script>
<script>
let editingId=null,unsub=null;const nameEl=document.getElementById('studentName'),numEl=document.getElementById('pickupNumber'),qrEl=document.getElementById('qrId'),activeEl=document.getElementById('studentActive'),msg=document.getElementById('studentMessage'),cancel=document.getElementById('cancelEdit');
function resetForm(){editingId=null;nameEl.value='';numEl.value='';qrEl.value='';activeEl.checked=true;cancel.style.display='none';document.getElementById('saveStudent').textContent='Save Student';}
document.getElementById('saveStudent').onclick=async()=>{try{const r=await saveStudentRecord({id:editingId,name:nameEl.value,pickupNumber:numEl.value,qrId:qrEl.value,active:activeEl.checked});msg.textContent=r.message;if(r.success)resetForm();}catch(e){msg.textContent='Database error: '+e.message;}};cancel.onclick=resetForm;
document.getElementById('ensureDemo').onclick=async()=>{try{await ensureDemoStudent();msg.textContent='Test Student #42 is available in the registry.';}catch(e){msg.textContent=e.message;}};
async function begin(){const user=await authReady;if(!user)return;unsub=studentsRef().orderBy('pickupNumber').onSnapshot(s=>{const c=document.getElementById('studentList');c.innerHTML='';if(s.empty){c.innerHTML='<p class="empty">No student records yet.</p>';return;}s.forEach(d=>{const x={id:d.id,...d.data()},row=document.createElement('div');row.className='queue-item';const left=document.createElement('div');left.innerHTML=`<div><strong>#${x.pickupNumber} — ${x.name}</strong></div><div class="queue-meta">QR: ${x.qrId} | ${x.active?'Active':'Inactive'}</div>`;const ctr=document.createElement('div');const edit=document.createElement('button');edit.className='small queue-move';edit.textContent='Edit';edit.onclick=()=>{editingId=x.id;nameEl.value=x.name;numEl.value=x.pickupNumber;qrEl.value=x.qrId;activeEl.checked=!!x.active;cancel.style.display='inline-block';document.getElementById('saveStudent').textContent='Update Student';window.scrollTo({top:0,behavior:'smooth'});};const toggle=document.createElement('button');toggle.className='small secondary';toggle.style.marginLeft='8px';toggle.textContent=x.active?'Deactivate':'Activate';toggle.onclick=()=>setStudentActive(x.id,!x.active);ctr.append(edit,toggle);row.append(left,ctr);c.appendChild(row);});},e=>msg.textContent='Database error: '+e.message);}
begin();
</script></body></html>
