<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pickup Display</title>
  <link rel="stylesheet" href="style.css" /> </head> <body class="big-display">
  <div style="margin-bottom: 20px;">
    <a href="admin.html" class="display-back-btn">&larr; Back to Admin</a>
  </div>

  <h1>Pickup Queue</h1>

  <div id="highlightSection"></div>

  <div style="margin-top: 30px; border-top: 2px solid #374151; padding-top: 20px;">
    <h2 style="font-size: 24px; color: #9ca3af; margin-bottom: 16px;">Up Next</h2>
    <div id="remainingSection"></div>
  </div>

  <script src="app.js"></script>
  <script>
    function renderDisplay() {
      const highlightContainer = document.getElementById("highlightSection");
      const remainingContainer = document.getElementById("remainingSection");
      const queue = getQueue();

      highlightContainer.innerHTML = "";
      remainingContainer.innerHTML = "";

      if (queue.length === 0) {
        highlightContainer.innerHTML = `<p class="empty" style="color: #ccc;">No cars currently in queue.</p>`;
        return;
      }

      const highlightCount = Math.min(6, queue.length);

      for (let i = 0; i < highlightCount; i++) {
        const item = queue[i];
        const div = document.createElement("div");
        div.className = "big-number";
        div.style.background = i < 6 ? "#5b21b6" : "#111827";
        div.style.border = i < 6 ? "2px solid #a78bfa" : "1px solid #374151";
        div.innerHTML = `<strong>#${i + 1} - ${item.tagNumber}${item.studentName ? " — " + item.studentName : ""}</strong>`;
        highlightContainer.appendChild(div);
      }

      if (queue.length > highlightCount) {
        for (let i = highlightCount; i < queue.length; i++) {
          const item = queue[i];
          const div = document.createElement("div");
          div.className = "big-number";
          div.style.fontSize = "24px";
          div.style.padding = "12px";
          div.style.background = "#0f172a";
          div.style.border = "1px solid #1f2937";
          div.innerHTML = `<strong>#${i + 1} - ${item.tagNumber}${item.studentName ? " — " + item.studentName : ""}</strong>`;
          remainingContainer.appendChild(div);
        }
      } else {
        remainingContainer.innerHTML = `<p class="empty" style="color: #666;">No more cars in queue.</p>`;
      }
    }

    renderDisplay();
    setInterval(renderDisplay, 1000);
    window.addEventListener("storage", renderDisplay);
  </script>
</body>
</html>
