<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin</title>
  <link rel="stylesheet" href="style.css?v=4.3.7" />
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="scanner.html">Scanner</a>
    <a href="display.html">Display</a>
    <a class="active" href="admin.html">Admin</a>
      <a href="students.html">Students & QR</a>
  <a href="history.html">History</a></nav>

  <div class="container">
    <div class="card">
      <h1>Admin</h1>
      <p>Use this page to adjust queue order, move a car to the top, add missed tags, and mark cars as served.</p>

      <input id="adminAddInput" type="text" inputmode="numeric" enterkeyhint="go" autocomplete="off" placeholder="Enter missed tag number" />
      <br />
      <button class="primary" onclick="submitAdminAdd('adminAddInput', 'adminMessage')">Add Tag</button>

      <div id="adminMessage" class="message"></div>

      <div class="admin-actions">
        <button class="danger" onclick="handleClearAll()">Clear Active Queue</button>
        <button class="danger" onclick="handleClearServed()">Clear Served Log</button>
      </div>
    </div>

    <div class="card">
      <h2>Active Queue</h2>
      <div id="adminQueue" class="queue-list"></div>
    </div>

    <div class="card">
      <h2>Recently Served</h2>
      <div id="servedQueue" class="queue-list"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script><script src="firebase-config.js?v=4.3.7"></script><script src="auth.js?v=4.3.7"></script><script src="roles.js?v=4.3.7"></script><script src="app.js?v=4.3.7"></script><script>requireRole(["admin","staff"]);</script>
  <script>
    async function handleClearAll() {
      await clearQueue();
    }

    async function handleClearServed() {
      await clearServedList();
    }

    const adminAddInput = document.getElementById("adminAddInput");

    adminAddInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        submitAdminAdd("adminAddInput", "adminMessage");
      }
    });

    renderAllLists();
    startRealtimeSync();
  </script>
</body>
</html>
