<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OCR Test - Tag 42</title>
  <link rel="stylesheet" href="style.css?v=4.3.2" />
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="scanner.html">Scanner</a>
    <a href="display.html">Display</a>
    <a href="admin.html">Admin</a>
    <a class="active" href="ocr-test.html">OCR Test</a>
  </nav>

  <div class="container">
    <div class="card">
      <h1>OCR Test - Read Tag 42</h1>
      <p>Point your camera at the pickup tag. Position the tag in the scan zone and click Capture.</p>

      <div style="position: relative; display: inline-block; margin-bottom: 16px;">
        <video id="video" width="640" height="480" autoplay playsinline style="border: 2px solid #333; background: #000;"></video>
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 300px; height: 200px; border: 3px dashed #3b82f6; pointer-events: none;"></div>
      </div>

      <br />
      <button class="primary" id="captureBtn">Capture & Read</button>
      <button class="secondary" id="retryBtn" style="display: none; margin-left: 8px;">Retry</button>

      <div id="result" style="margin-top: 20px; font-size: 18px;"></div>
    </div>

    <div class="card" id="previewCard" style="display: none;">
      <h2>Captured Image</h2>
      <canvas id="canvas" width="640" height="480" style="border: 1px solid #ccc;"></canvas>
      <div id="ocrText" style="margin-top: 12px; font-size: 20px; font-weight: bold;"></div>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const captureBtn = document.getElementById('captureBtn');
    const retryBtn = document.getElementById('retryBtn');
    const result = document.getElementById('result');
    const previewCard = document.getElementById('previewCard');
    const ocrText = document.getElementById('ocrText');

    let stream = null;

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        video.srcObject = stream;
      } catch (err) {
        result.textContent = 'Camera error: ' + err.message;
      }
    }

    captureBtn.addEventListener('click', async () => {
      result.textContent = 'Reading... please wait.';
      captureBtn.disabled = true;

      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // Crop to center scan zone (300x200 area in middle of 640x480)
      const cropX = (640 - 300) / 2;
      const cropY = (480 - 200) / 2;
      const cropCanvas = document.createElement('canvas');
      cropCanvas.width = 300;
      cropCanvas.height = 200;
      const cropCtx = cropCanvas.getContext('2d');
      cropCtx.drawImage(canvas, cropX, cropY, 300, 200, 0, 0, 300, 200);

      const imageData = cropCanvas.toDataURL('image/png');

      try {
        const { data: { text } } = await Tesseract.recognize(imageData, 'eng', {
          logger: m => console.log(m)
        });

        const cleaned = text.replace(/\D/g, '').trim();

        previewCard.style.display = 'block';
        ocrText.textContent = 'OCR Result: "' + text.trim() + '" | Cleaned: ' + (cleaned || 'none');

        if (cleaned === '42') {
          result.innerHTML = '<span style="color: green; font-weight: bold;">SUCCESS: Read as 42</span>';
        } else if (cleaned) {
          result.innerHTML = '<span style="color: orange; font-weight: bold;">PARTIAL: Read as ' + cleaned + ' (expected 42)</span>';
        } else {
          result.innerHTML = '<span style="color: red; font-weight: bold;">FAILED: No number detected</span>';
        }

        captureBtn.style.display = 'none';
        retryBtn.style.display = 'inline-block';

      } catch (err) {
        result.textContent = 'OCR error: ' + err.message;
        captureBtn.disabled = false;
      }
    });

    retryBtn.addEventListener('click', () => {
      previewCard.style.display = 'none';
      result.textContent = '';
      captureBtn.disabled = false;
      captureBtn.style.display = 'inline-block';
      retryBtn.style.display = 'none';
    });

    startCamera();
  </script>
</body>
</html>
