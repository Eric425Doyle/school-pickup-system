<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Audit History</title><link rel="stylesheet" href="style.css?v=4.3.3"></head><body>
<nav><a href="index.html">Home</a><a href="scanner.html">Scanner</a><a href="display.html">Display</a><a href="admin.html">Admin</a><a href="students.html">Students & QR</a><a class="active" href="history.html">History</a></nav>
<div class="container"><div class="card"><h1>Audit History — V4.3.3.3</h1><p>Administrative record of important pickup-system actions. This page is restricted to Admin accounts.</p><div id="historyMessage" class="message"></div></div><div class="card"><h2>Recent Activity</h2><div id="historyList" class="queue-list"></div></div></div>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script><script src="firebase-config.js?v=4.3.3"></script><script src="auth.js?v=4.3.3"></script><script src="roles.js?v=4.3.3"></script><script src="app.js?v=4.3.3"></script>
<script>
async function beginHistory(){const role=await requireRole(['admin']);if(!role)return;db.collection('auditLog').limit(100).onSnapshot(s=>{const c=document.getElementById('historyList');c.innerHTML='';if(s.empty){c.innerHTML='<p class="empty">No audit events yet.</p>';return;}[...s.docs].sort((a,b)=>String(b.data().timestampIso||'').localeCompare(String(a.data().timestampIso||''))).forEach(d=>{const x=d.data(),r=document.createElement('div');r.className='queue-item';const details=x.details||{};const detailText=Object.entries(details).map(([k,v])=>`${k}: ${Array.isArray(v)?v.join(', '):v}`).join(' | ');r.innerHTML=`<div><div><strong>${x.action||'ACTION'}</strong></div><div class="queue-meta">${x.timestamp||x.timestampIso||''} — ${x.performedByEmail||x.performedByUid||'unknown'} (${x.role||'role unknown'})</div>${detailText?`<div class="queue-meta">${detailText}</div>`:''}</div>`;c.appendChild(r);});},e=>document.getElementById('historyMessage').textContent='Database error: '+e.message);}
beginHistory();
</script></body></html>
